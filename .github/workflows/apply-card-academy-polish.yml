name: Apply Card Academy Polish

on:
  push:
    branches:
      - card-academy-full-v1
    paths:
      - '.integration/applyPolish.mjs'
      - '.github/workflows/apply-card-academy-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: card-academy-full-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .integration/applyPolish.mjs
      - name: Commit polish if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'HoldWise Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/games/engines/speed.js src/components/games/SolitaireTable.jsx
          git commit -m 'fix: close Speed stall and Solitaire DOM edge cases'
          git push origin HEAD:card-academy-full-v1
