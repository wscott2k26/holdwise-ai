name: HoldWise Premium V7 Verification

on:
  push:
    branches:
      - feature/holdwise-casino-premium-v7
    paths:
      - .release/premium-v7-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 22

      - name: Run all V7 verification gates
        id: gates
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/premium-v7-verification.log"
          : > "$LOG"
          run_gate() {
            NAME="$1"; shift
            echo "=== $NAME ===" | tee -a "$LOG"
            "$@" >> "$LOG" 2>&1
            CODE=$?
            echo "$NAME=$CODE" >> "$GITHUB_OUTPUT"
            echo "$NAME=$CODE" | tee -a "$LOG"
            return 0
          }

          echo "node=$(node --version 2>/dev/null || echo unavailable)" | tee -a "$LOG"
          echo "npm=$(npm --version 2>/dev/null || echo unavailable)" | tee -a "$LOG"
          run_gate contract node --test tests/casino-premium-v7.test.mjs

          echo "=== rehydrate ===" | tee -a "$LOG"
          (
            set -euo pipefail
            base64 -d .appetize/full-data/lessons.b64 | gunzip > src/lib/lessons.js
            cat .appetize/full-data/academy.part.* | base64 -d | gunzip > src/lib/academy.js
            test "$(sha256sum src/lib/lessons.js | awk '{print $1}')" = "ada157e544ed0fa5c578367e21172cf1c925df1af048881a453c336739a5c532"
            test "$(sha256sum src/lib/academy.js | awk '{print $1}')" = "5dd515383d75bdd842a56f9cf2adfd8a6536a76ca3200b0b1fa560cfcddfd282"
          ) >> "$LOG" 2>&1
          REHYDRATE=$?
          echo "rehydrate=$REHYDRATE" >> "$GITHUB_OUTPUT"
          echo "rehydrate=$REHYDRATE" | tee -a "$LOG"

          run_gate install npm install --no-audit --no-fund
          run_gate tests npm test
          run_gate lint npm run lint
          run_gate typecheck npm run typecheck
          run_gate build npm run build
          run_gate gameplay_audit npm run audit:gameplay
          cat "$LOG"
          exit 0

      - name: Persist verification receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          OUT=.release/premium-v7-verification.txt
          CONTRACT='${{ steps.gates.outputs.contract }}'
          REHYDRATE='${{ steps.gates.outputs.rehydrate }}'
          INSTALL='${{ steps.gates.outputs.install }}'
          TESTS='${{ steps.gates.outputs.tests }}'
          LINT='${{ steps.gates.outputs.lint }}'
          TYPECHECK='${{ steps.gates.outputs.typecheck }}'
          BUILD='${{ steps.gates.outputs.build }}'
          AUDIT='${{ steps.gates.outputs.gameplay_audit }}'
          OVERALL=0
          for code in "$CONTRACT" "$REHYDRATE" "$INSTALL" "$TESTS" "$LINT" "$TYPECHECK" "$BUILD" "$AUDIT"; do
            if [[ "$code" != "0" ]]; then OVERALL=1; fi
          done
          {
            echo "HoldWise Premium V7 Verification"
            echo "source_sha=$GITHUB_SHA"
            echo "node=$(node --version 2>/dev/null || echo unavailable)"
            echo "contract=$CONTRACT"
            echo "rehydrate=$REHYDRATE"
            echo "install=$INSTALL"
            echo "tests=$TESTS"
            echo "lint=$LINT"
            echo "typecheck=$TYPECHECK"
            echo "build=$BUILD"
            echo "gameplay_audit=$AUDIT"
            echo "overall=$OVERALL"
            echo
            if [[ -f "$RUNNER_TEMP/premium-v7-verification.log" ]]; then tail -n 260 "$RUNNER_TEMP/premium-v7-verification.log"; else echo "verification_log=missing"; fi
          } > "$OUT"
          cat "$OUT"
          git config user.name 'HoldWise Premium Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"
          git commit -m "chore: record premium v7 verification ${GITHUB_SHA::7} [skip ci]" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
          test "$OVERALL" = "0"
