name: HoldWise Premium V7 Contract

on:
  push:
    branches:
      - feature/holdwise-casino-premium-v7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run premium V7 contract
        id: contract
        shell: bash
        run: |
          set +e
          node --test tests/casino-premium-v7.test.mjs > "$RUNNER_TEMP/premium-v7.log" 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/premium-v7.log"
          exit 0
      - name: Persist contract receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          OUT=.release/premium-v7-contract.txt
          {
            echo "HoldWise Premium V7 Contract"
            echo "source_sha=$GITHUB_SHA"
            echo "exit_code=${{ steps.contract.outputs.code }}"
            echo
            cat "$RUNNER_TEMP/premium-v7.log"
          } > "$OUT"
          git config user.name 'HoldWise Premium Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record premium v7 contract ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Enforce contract result
        shell: bash
        run: test "${{ steps.contract.outputs.code }}" = "0"
