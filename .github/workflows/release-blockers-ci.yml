name: HoldWise Release Blockers

on:
  push:
    branches:
      - card-academy-full-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run blocker regression tests
        run: |
          set -euo pipefail
          node --test \
            tests/engine-registry-complete.test.mjs \
            tests/gin-rummy-engine.test.mjs \
            tests/tutorial-live-engine.test.mjs \
            tests/solitaire-dom-contract.test.mjs
      - name: Install dependencies
        if: always()
        run: npm install --no-audit --no-fund
      - name: Production Vite build
        if: always()
        run: npm run build
