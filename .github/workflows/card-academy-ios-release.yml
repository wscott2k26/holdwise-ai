name: HoldWise Card Academy iOS Release

on:
  push:
    branches:
      - card-academy-full-v1
    paths:
      - '.release/final-source-status.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-release:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: card-academy-full-v1
          fetch-depth: 0
      - name: Require green source QA receipt
        run: grep -q '^overall=PASS$' .release/final-source-status.txt
      - name: Rehydrate sealed learning data
        run: |
          set -euo pipefail
          base64 -D -i .appetize/full-data/lessons.b64 | gunzip > src/lib/lessons.js
          cat .appetize/full-data/academy.part.* | base64 -D | gunzip > src/lib/academy.js
          test "$(shasum -a 256 src/lib/lessons.js | awk '{print $1}')" = "ada157e544ed0fa5c578367e21172cf1c925df1af048881a453c336739a5c532"
          test "$(shasum -a 256 src/lib/academy.js | awk '{print $1}')" = "5dd515383d75bdd842a56f9cf2adfd8a6536a76ca3200b0b1fa560cfcddfd282"
      - name: Install XcodeGen and web dependencies
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          npm install --no-audit --no-fund
      - name: Native release regression gates
        run: |
          set -euo pipefail
          node --test \
            tests/native-ready-source.test.mjs \
            tests/native-boot.test.mjs \
            tests/native-web-packaging.test.mjs \
            tests/stormandme-native-contract.test.mjs \
            tests/engine-registry-complete.test.mjs \
            tests/no-placeholder-routes.test.mjs \
            tests/tutorial-live-engine.test.mjs \
            tests/google3-all-games.test.mjs
          npm run audit:gameplay
      - name: Build production web and runtime-open all 21 games/tutorials
        run: |
          set -euo pipefail
          npm run build
          python3 -m http.server 4173 -d dist >"$RUNNER_TEMP/holdwise-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 2
          CHROME=''
          for candidate in \
            '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' \
            '/Applications/Chromium.app/Contents/MacOS/Chromium' \
            '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge'; do
            if [ -x "$candidate" ]; then CHROME="$candidate"; break; fi
          done
          test -n "$CHROME"
          mkdir -p "$RUNNER_TEMP/webshots" "$RUNNER_TEMP/dom"
          node --input-type=module - <<'NODE' > "$RUNNER_TEMP/catalog.tsv"
          import { CARD_GAMES } from './src/games/catalog.js';
          for (const game of CARD_GAMES) console.log(`${game.id}\t${game.title}`);
          NODE
          COUNT=0
          while IFS=$'\t' read -r ID TITLE; do
            PROFILE="$RUNNER_TEMP/chrome-$COUNT"
            "$CHROME" --headless --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:4173/#/game/$ID" > "$RUNNER_TEMP/dom/game-$ID.html"
            grep -Fq "$TITLE" "$RUNNER_TEMP/dom/game-$ID.html"
            rm -rf "$PROFILE"
            PROFILE="$RUNNER_TEMP/chrome-t-$COUNT"
            "$CHROME" --headless --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:4173/#/game/$ID/tutorial" > "$RUNNER_TEMP/dom/tutorial-$ID.html"
            grep -Fq "$TITLE" "$RUNNER_TEMP/dom/tutorial-$ID.html"
            grep -Fq 'Try a legal move' "$RUNNER_TEMP/dom/tutorial-$ID.html"
            rm -rf "$PROFILE"
            COUNT=$((COUNT+1))
          done < "$RUNNER_TEMP/catalog.tsv"
          test "$COUNT" -eq 21
          for ROUTE in academy game/texas-holdem game/jacks-or-better game/blackjack game/klondike game/spades game/gin-rummy game/color-clash; do
            SAFE="$(echo "$ROUTE" | tr '/' '-')"
            PROFILE="$RUNNER_TEMP/shot-$SAFE"
            "$CHROME" --headless --disable-gpu --hide-scrollbars --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" --window-size=393,852 --force-device-scale-factor=1 --virtual-time-budget=3000 --screenshot="$RUNNER_TEMP/webshots/$SAFE.png" "http://127.0.0.1:4173/#/$ROUTE"
            test -s "$RUNNER_TEMP/webshots/$SAFE.png"
            rm -rf "$PROFILE"
          done
          echo 'web_game_routes=21' > "$RUNNER_TEMP/web-runtime-status.txt"
          echo 'web_tutorial_routes=21' >> "$RUNNER_TEMP/web-runtime-status.txt"
      - name: Harden and bundle native web assets
        run: |
          set -euo pipefail
          bash native/ios/HoldWiseAI/Scripts/prepare_web.sh
          node scripts/verify-native-web.mjs native/ios/HoldWiseAI/Resources/www
      - name: Generate and build universal iOS Simulator app
        working-directory: native/ios/HoldWiseAI
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          DERIVED="$RUNNER_TEMP/HoldWiseCardAcademyDerived"
          rm -rf "$DERIVED"
          xcodebuild -project HoldWiseAI.xcodeproj -scheme HoldWiseAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO clean build
          APP="$(find "$DERIVED/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          ARCHS="$(lipo -archs "$APP/$EXE")"
          test "$BUNDLE" = 'com.willywill.holdwiseai'
          [[ " $ARCHS " == *' arm64 '* ]]
          [[ " $ARCHS " == *' x86_64 '* ]]
          test -f "$APP/www/index.html"
          grep -q 'data-holdwise-native-inline' "$APP/www/index.html"
          echo "BUNDLE_ID=$BUNDLE" >> "$GITHUB_ENV"
          echo "APP_ARCHS=$ARCHS" >> "$GITHUB_ENV"
      - name: Real iPhone Simulator boot and screenshots
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); items=[d for ds in data.get("devices",{}).values() for d in ds if d.get("isAvailable") and "iPhone" in d.get("name","")]; print(items[0]["udid"] if items else "")')"
          test -n "$DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE_ID" data)"
          READY="$DATA_CONTAINER/Library/Caches/holdwise-boot-ready"
          ERROR="$DATA_CONTAINER/Library/Caches/holdwise-boot-error.txt"
          rm -f "$READY" "$ERROR"
          mkdir -p "$RUNNER_TEMP/native-shots"
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 0.25
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/native-shots/stormandme-intro.png" >/dev/null
          OK=0
          for _ in $(seq 1 45); do
            if [ -f "$READY" ]; then OK=1; break; fi
            if [ -f "$ERROR" ]; then cat "$ERROR"; exit 1; fi
            sleep 1
          done
          test "$OK" -eq 1
          test "$(cat "$READY")" = 'ready'
          sleep 1
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/native-shots/card-academy-lobby.png" >/dev/null
          test "$(stat -f%z "$RUNNER_TEMP/native-shots/card-academy-lobby.png")" -gt 20000
          xcrun simctl spawn "$DEVICE" log show --last 90s --style compact --predicate 'process == "HoldWise AI" OR eventMessage CONTAINS "HOLDWISE_BOOT"' > "$RUNNER_TEMP/native-shots/runtime.log" 2>&1 || true
          xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true
      - name: Package Appetize simulator ZIP
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/HoldWise-AI-Card-Academy-Appetize-v2.0.0.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          unzip -t "$ZIP"
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          SIZE="$(stat -f%z "$ZIP")"
          echo "FINAL_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "FINAL_SHA=$SHA" >> "$GITHUB_ENV"
          echo "FINAL_SIZE=$SIZE" >> "$GITHUB_ENV"
      - name: Write and persist iOS release receipt
        run: |
          set -euo pipefail
          cat > .release/ios-status.txt <<EOF
          HoldWise Card Academy iOS Release
          overall=PASS
          bundle_id=$BUNDLE_ID
          architectures=$APP_ARCHS
          web_game_routes=21
          web_tutorial_routes=21
          native_ready_marker=PASS
          native_lobby_screenshot=PASS
          zip_name=HoldWise-AI-Card-Academy-Appetize-v2.0.0.zip
          zip_sha256=$FINAL_SHA
          zip_bytes=$FINAL_SIZE
          EOF
          git config user.name 'HoldWise Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .release/ios-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record verified Card Academy iOS release [skip ci]'
            git push origin HEAD:card-academy-full-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HoldWise-AI-Card-Academy-Appetize-v2.0.0
          path: ${{ env.FINAL_ZIP }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: HoldWise-Card-Academy-Visual-Quadcheck
          path: |
            ${{ runner.temp }}/native-shots
            ${{ runner.temp }}/webshots
            ${{ runner.temp }}/web-runtime-status.txt
          if-no-files-found: error
          retention-days: 7
