name: Appetize Simulator Build

on:
  push:
    branches:
      - appetize-preview
      - appetize-runtime-fix-v2
      - card-academy-full-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: QA and build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout preview lane
        uses: actions/checkout@v4

      - name: Verify sealed course data transport
        shell: bash
        run: |
          set -euo pipefail
          base64 -D -i .appetize/full-data/lessons.b64 | gunzip > src/lib/lessons.js
          cat .appetize/full-data/academy.part.* | base64 -D | gunzip > src/lib/academy.js
          test "$(shasum -a 256 src/lib/lessons.js | awk '{print $1}')" = "ada157e544ed0fa5c578367e21172cf1c925df1af048881a453c336739a5c532"
          test "$(shasum -a 256 src/lib/academy.js | awk '{print $1}')" = "5dd515383d75bdd842a56f9cf2adfd8a6536a76ca3200b0b1fa560cfcddfd282"

      - name: Report ARM build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "arch=$(uname -m)"
          xcodebuild -version
          node --version
          npm --version
          test -f src/main.jsx
          test -f src/App.jsx
          test -f src/pages/PracticeVP.jsx
          test -f native/ios/HoldWiseAI/project.yml

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Fresh premium and gameplay tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/native-boot.test.mjs tests/app-params-native.test.mjs tests/native-web-packaging.test.mjs tests/stormandme-native-contract.test.mjs tests/daily-engagement.test.mjs tests/haptics.test.mjs tests/mastery.test.mjs tests/premium-visual.test.mjs
          npm run build

      - name: Fresh exhaustive gameplay audit
        shell: bash
        run: npm run audit:gameplay

      - name: Bundle native web assets
        shell: bash
        run: |
          set -euo pipefail
          bash native/ios/HoldWiseAI/Scripts/prepare_web.sh
          node scripts/verify-native-web.mjs native/ios/HoldWiseAI/Resources/www

      - name: Generate iOS project
        working-directory: native/ios/HoldWiseAI
        shell: bash
        run: xcodegen generate --spec project.yml

      - name: Build ARM iOS Simulator app
        working-directory: native/ios/HoldWiseAI
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/HoldWiseDerivedData"
          rm -rf "$DERIVED"
          xcodebuild -project HoldWiseAI.xcodeproj -scheme HoldWiseAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO clean build

      - name: Verify simulator artifact
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/HoldWiseDerivedData/Build/Products/Debug-iphonesimulator"
          APP="$(find "$PRODUCT_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          ARCHS="$(lipo -archs "$APP/$EXE")"
          WEB_INDEX="$(find "$APP" -type f -name 'index.html' -print -quit)"
          echo "app=$APP"
          echo "bundle_id=$BUNDLE"
          echo "architectures=$ARCHS"
          echo "web_index=$WEB_INDEX"
          file "$APP/$EXE"
          lipo -info "$APP/$EXE"
          test "$BUNDLE" = "com.willywill.holdwiseai"
          [[ " $ARCHS " == *" arm64 "* ]]
          test -n "$WEB_INDEX"
          grep -q "root" "$WEB_INDEX"
          grep -q "data-holdwise-native-inline" "$WEB_INDEX"
          echo "native_web_bundle=present"

      - name: Smoke test real simulator boot
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); items=[d for ds in data.get("devices",{}).values() for d in ds if d.get("isAvailable") and "iPhone" in d.get("name","")]; print(items[0]["udid"] if items else "")')"
          if [[ -z "$DEVICE" ]]; then
            echo "runtime_smoke=SKIP (no available iPhone Simulator device on runner)"
            exit 0
          fi

          LOG="$RUNNER_TEMP/holdwise-runtime.log"
          SHOT="$RUNNER_TEMP/holdwise-runtime.png"
          xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE" com.willywill.holdwiseai data)"
          READY_MARKER="$DATA_CONTAINER/Library/Caches/holdwise-boot-ready"
          ERROR_MARKER="$DATA_CONTAINER/Library/Caches/holdwise-boot-error.txt"
          rm -f "$READY_MARKER" "$ERROR_MARKER"

          xcrun simctl terminate "$DEVICE" com.willywill.holdwiseai >/dev/null 2>&1 || true
          xcrun simctl launch "$DEVICE" com.willywill.holdwiseai

          READY=0
          for _ in $(seq 1 30); do
            if [[ -f "$READY_MARKER" ]]; then
              READY=1
              break
            fi
            if [[ -f "$ERROR_MARKER" ]]; then
              echo "Runtime reported a native/web startup error:"
              cat "$ERROR_MARKER"
              xcrun simctl io "$DEVICE" screenshot "$SHOT" >/dev/null 2>&1 || true
              xcrun simctl spawn "$DEVICE" log show --last 60s --style compact --predicate 'process == "HoldWise AI" OR eventMessage CONTAINS "HOLDWISE_BOOT"' >"$LOG" 2>&1 || true
              exit 1
            fi
            sleep 1
          done

          xcrun simctl io "$DEVICE" screenshot "$SHOT" >/dev/null 2>&1 || true
          xcrun simctl spawn "$DEVICE" log show --last 60s --style compact --predicate 'process == "HoldWise AI" OR eventMessage CONTAINS "HOLDWISE_BOOT"' >"$LOG" 2>&1 || true
          if [[ "$READY" != "1" ]]; then
            echo "HoldWise did not create its ready marker within 30 seconds."
            cat "$LOG" || true
            exit 1
          fi

          echo "runtime_smoke=PASS native ready marker present"
          test "$(cat "$READY_MARKER")" = "ready"
          xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HoldWise-AI-Runtime-Diagnostics
          path: |
            ${{ runner.temp }}/holdwise-runtime.png
            ${{ runner.temp }}/holdwise-runtime.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package Appetize ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/HoldWise-AI-Appetize-Simulator-v1.4.0.zip"
          rm -f "$OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          unzip -t "$OUT"
          echo "ZIP_PATH=$OUT" >> "$GITHUB_ENV"
          shasum -a 256 "$OUT"

      - name: Upload verified simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HoldWise-AI-Appetize-Simulator-v1.4.0
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 7
