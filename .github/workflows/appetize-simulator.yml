name: Appetize Simulator Build

on:
  push:
    branches:
      - appetize-preview
      - appetize-runtime-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: QA and build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout preview lane
        uses: actions/checkout@v4

      - name: Verify sealed course data transport
        shell: bash
        run: |
          set -euo pipefail
          base64 -D -i .appetize/full-data/lessons.b64 | gunzip > src/lib/lessons.js
          cat .appetize/full-data/academy.part.* | base64 -D | gunzip > src/lib/academy.js
          test "$(shasum -a 256 src/lib/lessons.js | awk '{print $1}')" = "ada157e544ed0fa5c578367e21172cf1c925df1af048881a453c336739a5c532"
          test "$(shasum -a 256 src/lib/academy.js | awk '{print $1}')" = "5dd515383d75bdd842a56f9cf2adfd8a6536a76ca3200b0b1fa560cfcddfd282"

      - name: Report ARM build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "arch=$(uname -m)"
          xcodebuild -version
          node --version
          npm --version
          test -f src/main.jsx
          test -f src/App.jsx
          test -f src/pages/PracticeVP.jsx
          test -f native/ios/HoldWiseAI/project.yml

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Fresh premium, gameplay, and native runtime contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/daily-engagement.test.mjs tests/haptics.test.mjs tests/mastery.test.mjs tests/premium-visual.test.mjs tests/native-runtime-contract.test.mjs
          npm run build

      - name: Fresh exhaustive gameplay audit
        shell: bash
        run: npm run audit:gameplay

      - name: Bundle native web assets
        shell: bash
        run: bash native/ios/HoldWiseAI/Scripts/prepare_web.sh

      - name: Generate iOS project
        working-directory: native/ios/HoldWiseAI
        shell: bash
        run: xcodegen generate --spec project.yml

      - name: Build ARM iOS Simulator app
        working-directory: native/ios/HoldWiseAI
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/HoldWiseDerivedData"
          rm -rf "$DERIVED"
          xcodebuild -project HoldWiseAI.xcodeproj -scheme HoldWiseAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO clean build

      - name: Verify simulator artifact
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/HoldWiseDerivedData/Build/Products/Debug-iphonesimulator"
          APP="$(find "$PRODUCT_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          ARCHS="$(lipo -archs "$APP/$EXE")"
          WEB_INDEX="$(find "$APP" -type f -name 'index.html' -print -quit)"
          echo "app=$APP"
          echo "bundle_id=$BUNDLE"
          echo "architectures=$ARCHS"
          echo "web_index=$WEB_INDEX"
          file "$APP/$EXE"
          lipo -info "$APP/$EXE"
          test "$BUNDLE" = "com.willywill.holdwiseai"
          [[ " $ARCHS " == *" arm64 "* ]]
          test -n "$WEB_INDEX"
          grep -q "root" "$WEB_INDEX"
          echo "native_web_bundle=present"

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/holdwise-runtime.log"
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for group in data.get("devices",{}).values() for d in group if d.get("isAvailable") and d.get("name","").startswith("iPhone")), ""))')"
          if [[ -z "$UDID" ]]; then
            echo "runtime_smoke=skipped-no-compatible-simulator"
            exit 0
          fi
          echo "runtime_simulator=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          : > "$LOG"
          set +e
          xcrun simctl launch --terminate-running-process --console "$UDID" com.willywill.holdwiseai > "$LOG" 2>&1 &
          LAUNCH_PID=$!
          set -e
          sleep 15
          xcrun simctl terminate "$UDID" com.willywill.holdwiseai || true
          wait "$LAUNCH_PID" || true
          echo "===== HoldWise runtime console ====="
          cat "$LOG" || true
          echo "===== HOLDWISE markers ====="
          grep 'HOLDWISE_' "$LOG" || true
          xcrun simctl shutdown "$UDID" || true

      - name: Package Appetize ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/HoldWise-AI-Appetize-Simulator-v1.4.0.zip"
          rm -f "$OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          unzip -t "$OUT"
          echo "ZIP_PATH=$OUT" >> "$GITHUB_ENV"
          shasum -a 256 "$OUT"

      - name: Upload verified simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HoldWise-AI-Appetize-Simulator-v1.4.0
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 7
