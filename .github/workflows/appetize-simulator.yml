name: Appetize Simulator Build

on:
  push:
    branches:
      - appetize-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: QA and build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout preview lane
        uses: actions/checkout@v4

      - name: Report build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "arch=$(uname -m)"
          xcodebuild -version
          node --version
          npm --version
          test -f package.json
          test -d src
          test -f native/ios/HoldWiseAI/project.yml

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Fresh full web QA
        shell: bash
        run: npm run qa

      - name: Fresh gameplay audit
        shell: bash
        run: npm run audit:gameplay

      - name: Bundle native web assets
        shell: bash
        run: bash native/ios/HoldWiseAI/Scripts/prepare_web.sh

      - name: Generate iOS project
        working-directory: native/ios/HoldWiseAI
        shell: bash
        run: xcodegen generate --spec project.yml

      - name: Build ARM iOS Simulator app
        working-directory: native/ios/HoldWiseAI
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/HoldWiseDerivedData"
          rm -rf "$DERIVED"
          xcodebuild \
            -project HoldWiseAI.xcodeproj \
            -scheme HoldWiseAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Verify simulator artifact
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/HoldWiseDerivedData/Build/Products/Debug-iphonesimulator"
          APP="$(find "$PRODUCT_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "app=$APP"
          echo "bundle_id=$BUNDLE"
          echo "executable=$EXE"
          file "$APP/$EXE"
          lipo -info "$APP/$EXE"
          test "$BUNDLE" = "com.willywill.holdwiseai"
          lipo -archs "$APP/$EXE" | tr ' ' '\n' | grep -qx arm64
          test -f "$APP/www/index.html"
          echo "native_web_bundle=present"

      - name: Package Appetize ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/HoldWise-AI-Appetize-Simulator-v1.4.0.zip"
          rm -f "$OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          unzip -t "$OUT"
          echo "ZIP_PATH=$OUT" >> "$GITHUB_ENV"
          shasum -a 256 "$OUT"

      - name: Upload verified simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HoldWise-AI-Appetize-Simulator-v1.4.0
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 7
