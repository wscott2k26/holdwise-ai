name: Apply Final Gameplay Polish

on:
  push:
    branches:
      - card-academy-full-v1
    paths:
      - '.integration/applyFinalGameplayPolish.mjs'
      - '.github/workflows/apply-final-gameplay-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: card-academy-full-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .integration/applyFinalGameplayPolish.mjs
      - name: Commit final gameplay polish
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'HoldWise Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/games/engineRegistry.js src/pages/GameRoom.jsx src/pages/GameTutorial.jsx src/games/engines/speed.js src/components/games/SolitaireTable.jsx src/games/engines/colorClash.js src/games/engines/war.js src/components/games/FamilyTable.jsx
          git commit -m 'fix: finish full-play family and tutorial polish'
          git push origin HEAD:card-academy-full-v1
