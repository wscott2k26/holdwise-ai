name: Appetize Credential Probe

on:
  push:
    branches:
      - probe/appetize-token-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Appetize API safely
        shell: bash
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .release
          OUT=".release/appetize-credential-probe-${GITHUB_SHA}.txt"
          TOKEN_PRESENT=NO
          HTTP_CODE=NOT_CALLED
          HOLDWISE_KEY=""
          PUBLIC_KEY_SECRET_PRESENT=NO

          if [[ -n "${APPETIZE_PUBLIC_KEY:-}" ]]; then
            PUBLIC_KEY_SECRET_PRESENT=YES
          fi

          if [[ -n "${APPETIZE_API_TOKEN:-}" ]]; then
            TOKEN_PRESENT=YES
            BODY="$RUNNER_TEMP/appetize-list.json"
            HTTP_CODE="$(curl --silent --show-error --write-out '%{http_code}' --output "$BODY" \
              -H "X-API-KEY: $APPETIZE_API_TOKEN" \
              https://api.appetize.io/v1/apps || true)"

            if [[ "$HTTP_CODE" = "200" ]]; then
              HOLDWISE_KEY="$(python3 - "$BODY" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1], encoding='utf-8'))
          except Exception:
              print('')
              raise SystemExit
          rows=d.get('data') or []
          for row in rows:
              if row.get('bundle') == 'com.willywill.holdwiseai':
                  print(row.get('publicKey') or row.get('buildId') or '')
                  break
          PY
              )"
            fi
          fi

          cat > "$OUT" <<EOF
          HoldWise Appetize Credential Probe
          source_sha=$GITHUB_SHA
          token_present=$TOKEN_PRESENT
          api_http_code=$HTTP_CODE
          public_key_secret_present=$PUBLIC_KEY_SECRET_PRESENT
          discovered_holdwise_public_key=$HOLDWISE_KEY
          EOF

          cat "$OUT"
          git config user.name 'HoldWise Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"
          git commit -m "chore: record Appetize credential probe ${GITHUB_SHA::7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
